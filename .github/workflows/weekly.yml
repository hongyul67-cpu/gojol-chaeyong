name: 주간 수집

on:
  schedule:
    # 일 23:30 UTC = 월 08:30 (한국시간). 깃허브 예약은 혼잡하면 수십 분 밀릴 수 있다.
    - cron: "30 23 * * 0"
  workflow_dispatch:        # 필요할 때 손으로 돌리는 버튼

permissions:
  contents: write           # 결과를 저장소에 되커밋하려면 필요

concurrency:
  group: weekly-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
        run: python collect.py

      - name: 결과 되커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "주간 수집 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 실행 요약
        if: always()
        run: tail -n 25 data/log.txt || echo "로그 없음"

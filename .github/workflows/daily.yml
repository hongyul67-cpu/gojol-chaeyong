name: 매일 수집

on:
  schedule:
    # 23:50 UTC = 한국시간 아침 08:50.
    # 9시 정각에 맞추지 않고 10분 일찍 시작한다 — 깃허브 예약은 혼잡하면
    # 수십 분 밀리고, 특히 매시 00분이 가장 붐빈다. 조금 앞서 걸어 두어야
    # '9시에 열어 보면 이미 새로 고쳐져 있다'가 된다.
    - cron: "50 23 * * *"
  workflow_dispatch:        # 필요할 때 손으로 돌리는 버튼

permissions:
  contents: write           # 결과를 저장소에 되커밋하려면 필요

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 깃허브 서버는 UTC 로 돈다. 이걸 켜야 화면의 '마지막 갱신'과
      # 로그·날짜가 한국시간으로 찍힌다. (없으면 9시가 0시로 보인다)
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
        run: python collect.py

      - name: 결과 되커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "수집 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 실행 요약
        if: always()
        run: tail -n 25 data/log.txt || echo "로그 없음"
